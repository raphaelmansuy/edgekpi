name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install the library and the Malloy runtime
        run: |
          pip install -e ".[dev]"
          (cd edgekpi/backends/malloy_runtime && npm install --no-audit --no-fund)
      - name: Tests (warehouse tests skip without credentials)
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/898717877025/locations/global/workloadIdentityPools/edgekpi-github/providers/github
          service_account: edgekpi-demo-plan@saas-app-001.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          project_id: saas-app-001
      - name: Init
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: terraform init -input=false
      - name: Init without the remote state
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Plan against the image that is already deployed
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          image=$(gcloud run services describe edgekpi-demo --project saas-app-001 --region us-central1 --format='json' | python3 -c 'import json,sys; print(json.load(sys.stdin)["spec"]["template"]["spec"]["containers"][0]["image"])')
          terraform plan -input=false -lock-timeout=5m -var="image=${image}"
